<style>
:root{--gold:#c9a45c;--gold2:#ecd49c;--txt:#f5f2ea;--mut:rgba(245,242,234,.62);--p:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--txt);font-family:Heebo,Manrope,system-ui,sans-serif}
body{overflow-x:hidden}body.lock{overflow:hidden}
.serif{font-family:"Frank Ruhl Libre","Playfair Display",serif}
/* lang switch */
.lang{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:2px;padding:4px;border-radius:30px;
background:rgba(0,0,0,.35);border:1px solid rgba(236,212,156,.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);direction:ltr;opacity:0;transition:opacity 1s 1.4s}
.ready~.lang,body.started .lang{opacity:1}
.lang button{background:none;border:0;color:var(--mut);font:600 11px Manrope,sans-serif;letter-spacing:.12em;padding:6px 11px;border-radius:20px;cursor:pointer}
.lang button.on{background:var(--gold);color:#111}
/* bg */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg img{position:absolute;left:50%;top:0;height:100%;width:auto;min-width:100%;object-fit:cover;object-position:50% 12%;
transform:translateX(-50%) scale(calc(1.12 - var(--in,0)*.12 + var(--p)*.08));
filter:blur(calc(var(--p)*7px)) brightness(calc(1 - var(--p)*.55)) saturate(calc(1 - var(--p)*.3));transition:transform 1.8s cubic-bezier(.2,.7,.1,1)}
.bg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 22%,transparent 45%,rgba(0,0,0,.85) 88%,#000 100%),rgba(0,0,0,calc(var(--p)*.45))}
.bg .vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px #000}
/* hero */
.hero{position:relative;z-index:1;height:100svh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:0 16px calc(36px + env(safe-area-inset-bottom))}
.eyebrow{font:400 10.5px Manrope,sans-serif;letter-spacing:.32em;white-space:nowrap;color:var(--gold2);text-transform:uppercase;direction:ltr;opacity:0}
.name{font-weight:900;font-size:clamp(44px,13vw,72px);line-height:1.05;margin-top:12px;color:#f7f1e3;text-shadow:0 4px 30px rgba(0,0,0,.7);perspective:600px}
.name span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(-80deg);transform-origin:50% 100%}
.rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto}
.role{font-size:15px;font-weight:300;color:var(--mut);letter-spacing:.06em;opacity:0}
.cue{margin-top:30px;opacity:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mut);letter-spacing:.2em}
.cue i{width:22px;height:36px;border:1px solid rgba(236,212,156,.5);border-radius:12px;position:relative}
.cue i:after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold2);animation:wheel 1.8s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.ready .eyebrow{animation:fade 1s .2s forwards}.ready .name span{animation:flip .9s cubic-bezier(.2,.8,.2,1) forwards}
.ready .rule{animation:rule 1.2s .9s forwards}.ready .role{animation:fade 1s 1.1s forwards}.ready .cue{animation:fade 1s 1.6s forwards}
@keyframes fade{to{opacity:1}}@keyframes flip{to{opacity:1;transform:none}}@keyframes rule{to{width:140px}}
/* links */
.links{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:10px 16px 60px;perspective:900px}
.intro{text-align:center;margin:10px 0 26px}.intro h2{font-weight:700;font-size:27px}.intro p{color:var(--mut);font-size:14px;font-weight:300;margin-top:6px}
a.card{position:relative;display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:16px;border-radius:22px;text-decoration:none;color:var(--txt);overflow:hidden;
background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.12);
backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 20px 50px -20px rgba(0,0,0,.8);
opacity:0;transform:translateY(50px) rotateX(18deg);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1),border-color .3s}
a.card.on{opacity:1;transform:none}
a.card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(236,212,156,.18) 50%,transparent 70%);transform:translateX(120%);transition:transform .9s}
a.card:hover:before,a.card:active:before{transform:translateX(-120%)}a.card:hover,a.card:active{border-color:rgba(236,212,156,.55)}
.ic{flex:0 0 60px;height:60px;border-radius:16px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.12)}
.ic img{width:100%;height:100%;object-fit:cover}
.c1 .ic{background:#fff}.c2 .ic{background:#111;box-shadow:inset 0 0 0 1px rgba(236,212,156,.4)}.c2 .ic img{width:82%;height:82%;object-fit:contain}
.c3 .ic{background:linear-gradient(135deg,#35b4ea,#1676ad)}
.c4{border-color:rgba(201,164,92,.5);background:linear-gradient(135deg,rgba(201,164,92,.2),rgba(201,164,92,.05))}
.t{flex:1}.t small{display:block;font:600 10px Manrope,sans-serif;letter-spacing:.25em;color:var(--gold2)}
.t b{display:block;font-size:17px;font-weight:600;margin-top:3px}.t span{display:block;font-size:13px;color:var(--mut);font-weight:300;margin-top:2px}
[dir=ltr] .go{transform:scaleX(-1)}
.go{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid rgba(236,212,156,.4);display:grid;place-items:center;color:var(--gold2);font-size:16px}
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:8px;padding:16px;border-radius:18px;border:1px solid var(--gold);
background:linear-gradient(135deg,var(--gold2),var(--gold));color:#141210;font:600 16px Heebo,Manrope,sans-serif;cursor:pointer;box-shadow:0 14px 40px -14px rgba(201,164,92,.7)}
.save svg{width:20px;height:20px}
.soc{text-align:center;margin-top:34px}.soc p{font-size:12px;letter-spacing:.2em;color:var(--mut)}
.soc div{display:flex;justify-content:center;gap:14px;margin-top:14px}
.soc a{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--gold2);border:1px solid rgba(236,212,156,.35);background:rgba(255,255,255,.04);transition:.25s}
.soc a:hover,.soc a:active{background:var(--gold);color:#111}.soc svg{width:22px;height:22px}
footer{text-align:center;color:rgba(245,242,234,.3);font:400 11px Manrope,sans-serif;letter-spacing:.3em;margin-top:34px}

:focus-visible{outline:3px solid var(--gold2);outline-offset:3px;border-radius:12px}
.a11y-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-start:16px;z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid rgba(236,212,156,.5);
background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--gold2);display:grid;place-items:center;cursor:pointer}
.a11y-btn svg{width:26px;height:26px}
.a11y-panel{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));inset-inline-start:16px;z-index:6;width:230px;padding:10px;border-radius:18px;background:#141414;border:1px solid rgba(236,212,156,.35);display:none;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.a11y-panel.open{display:block}
.a11y-panel button{display:block;width:100%;text-align:start;padding:12px;margin:2px 0;border-radius:10px;border:0;background:none;color:var(--txt);font:400 15px Heebo,Manrope,sans-serif;cursor:pointer}
.a11y-panel button[aria-pressed=true]{background:rgba(201,164,92,.25);color:var(--gold2)}
.a11y-panel button:hover{background:rgba(255,255,255,.07)}
html.big{font-size:118%}html.big .t b{font-size:20px}html.big .t span,html.big .intro p,html.big .role{font-size:16px}
html.hc{--mut:#fff}html.hc a.card{background:#000!important;border-color:#fff!important;backdrop-filter:none}html.hc .bg{filter:brightness(.35)}html.hc .t small,html.hc .eyebrow{color:#ffe08a}
html.still *,html.still *:before,html.still *:after{animation:none!important;transition:none!important}html.still .name span,html.still .eyebrow,html.still .role,html.still .cue,html.still a.card,html.still .lang{opacity:1!important;transform:none!important}html.still .rule{width:140px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:none;place-items:center;padding:16px}.modal.open{display:grid}
.modal div{max-width:440px;background:#141414;border:1px solid rgba(236,212,156,.35);border-radius:20px;padding:24px;line-height:1.7;font-size:15px}
.modal h2{font-size:22px;margin-bottom:10px;color:var(--gold2)}.modal p{margin-bottom:10px;color:#e8e4da}.modal a{color:var(--gold2)}
.modal button{margin-top:8px;padding:10px 22px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:#111;font:600 15px Heebo,Manrope,sans-serif;cursor:pointer}
footer button{background:none;border:0;color:rgba(245,242,234,.5);font:400 12px Heebo,Manrope,sans-serif;text-decoration:underline;cursor:pointer;margin-top:10px;letter-spacing:0}
/* intro */
#intro{position:fixed;inset:0;z-index:10;background:#000;display:grid;place-items:center;transition:opacity 1s ease}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .mono{position:relative;font-family:"Playfair Display",serif;font-weight:900;font-size:44px;letter-spacing:.15em;color:var(--gold2);opacity:0;animation:mono 2.6s .3s forwards;direction:ltr}
@keyframes mono{0%{opacity:0;transform:scale(.6);filter:blur(10px)}35%{opacity:1;transform:scale(1);filter:none}75%{opacity:1}100%{opacity:0;transform:scale(3);filter:blur(8px)}}
#intro.out{opacity:0;pointer-events:none}
#skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.4);background:none;border:0;font-family:inherit}
@media (prefers-reduced-motion:reduce){#intro{display:none}.name span,.eyebrow,.role,.cue,.lang{opacity:1!important;transform:none!important}.rule{width:140px}a.card{opacity:1;transform:none}}

md.onclick=e=>{if(e.target===md)closeSt()};addEventListener('keydown',e=>{if(e.key==='Escape'){closeSt();ap.classList.remove('open')}});
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=cv.width=innerWidth*D;H=cv.height=innerHeight*D}rs();addEventListener('resize',rs);
const N=900,pts=[];for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=i*2.39996;pts.push([Math.cos(t)*r,y,Math.sin(t)*r,Math.random()])}
let t0=performance.now(),done=false;
function frame(now){if(done)return;const t=(now-t0)/1000;ctx.clearRect(0,0,W,H);
 const R=Math.min(W,H)*.32*(t<1.9?Math.min(1,t/1.1)**.5:1+Math.pow((t-1.9)*2.2,3));
 const a=t*.9,b=.35+Math.sin(t*.6)*.15,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),f=Math.min(W,H)*1.1;
 for(const p of pts){let x=p[0]*ca-p[2]*sa,z=p[0]*sa+p[2]*ca,y=p[1]*cb-z*sb;z=p[1]*sb+z*cb;
  x*=R;y*=R;z=z*R+f*1.1;if(z<10)continue;const k=f/z,sx=W/2+x*k,sy=H/2+y*k,s=Math.max(.4,1.9*k)*D;
  const al=Math.min(1,(k-.55)*1.6)*(.5+p[3]*.5)*(t>2.4?Math.max(0,1-(t-2.4)/.5):1);if(al<=0)continue;
  ctx.fillStyle=`rgba(236,212,156,${al})`;ctx.beginPath();ctx.arc(sx,sy,s,0,6.283);ctx.fill();}
 if(t>2.9)finish();else requestAnimationFrame(frame)}
function finish(){if(done)return;done=true;intro.classList.add('out');body.classList.remove('lock');body.classList.add('started');root.style.setProperty('--in',1);hero.classList.add('ready');setTimeout(()=>intro.remove(),1100)}
if(matchMedia('(prefers-reduced-motion:reduce)').matches||pref.still)finish();else requestAnimationFrame(frame);
document.getElementById('skip').onclick=finish;intro.addEventListener('click',finish);
})();
